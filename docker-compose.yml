services:
  postgres:
    image: postgres:16-alpine
    container_name: oyes-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: oyes_attendance
      POSTGRES_USER: oyes
      POSTGRES_PASSWORD: oyes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyes -d oyes_attendance"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
